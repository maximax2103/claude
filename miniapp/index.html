<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tetris</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="stat">
        <span class="stat-label">СЧЁТ</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">УРОВЕНЬ</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">ЛИНИИ</span>
        <span class="stat-value" id="lines">0</span>
      </div>
    </div>

    <div id="game-area">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="side-panel">
        <div class="panel-block">
          <div class="panel-label">СЛЕДУЮЩАЯ</div>
          <canvas id="next" width="100" height="100"></canvas>
        </div>
        <div class="panel-block">
          <div class="panel-label">РЕКОРД</div>
          <div class="panel-value" id="hi-score">0</div>
        </div>
      </div>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <div class="ctrl-center">
        <button class="ctrl-btn" id="btn-rotate">↻</button>
        <button class="ctrl-btn" id="btn-down">▼</button>
      </div>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <div id="drop-bar">
      <button id="btn-drop">СБРОС</button>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-box">
        <div id="overlay-title">ТЕТРИС</div>
        <div id="overlay-score"></div>
        <button id="btn-start">ИГРАТЬ</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
